name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      - name: Find Android project
        run: |
          echo "Current directory:"
          pwd
          echo "Project settings files:"
          find . -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) -print

      - name: Build debug APK
        run: |
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            gradle assembleDebug --stacktrace
          elif [ -f MedicineApp/settings.gradle.kts ] || [ -f MedicineApp/settings.gradle ]; then
            cd MedicineApp
            gradle assembleDebug --stacktrace
          else
            echo "Gradle project root not found."
            exit 1
          fi

      - name: Find generated APK
        if: always()
        run: find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedicineReminder-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

